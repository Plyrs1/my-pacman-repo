name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trust PKGBUILDs for makepkg (non-root builder user)
        run: |
          # makepkg refuses to run as root; use the unprivileged 'build' user
          useradd -m build
          printf 'build ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/build

      - name: Install build dependencies
        run: |
          # container ships with no synced databases
          pacman -Syu --noconfirm
          # gather depends+makedepends from every PKGBUILD and install them
          deps=$(for pkg in pkgs/*/; do
            source "${pkg}PKGBUILD"
            printf '%s\n' "${depends[@]}" "${makedepends[@]}"
          done | sort -u)
          if [ -n "$deps" ]; then
            pacman -S --noconfirm --needed $deps
          fi

      - name: Build all packages
        run: |
          chown -R build:build "$GITHUB_WORKSPACE"
          sudo -u build /bin/bash -c '
            set -e
            for pkg in pkgs/*/; do
              name="${pkg#pkgs/}"; name="${name%/}"
              scripts/build.sh "$name"
            done
          '

      - name: Upload repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo
          path: x86_64/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: x86_64

      - name: Verify database matches packages
        run: |
          cd x86_64
          python3 - <<'EOF'
          import glob
          import os
          import tarfile

          with tarfile.open('personal.db.tar.gz') as db:
              filenames = set()
              for member in db.getmembers():
                  if member.isfile() and member.name.endswith('/desc'):
                      fields = db.extractfile(member).read().decode().splitlines()
                      filenames.add(fields[fields.index('%FILENAME%') + 1])
          packages = {os.path.basename(path) for path in glob.glob('*.pkg.tar.zst')}
          assert packages, 'no packages to publish'
          assert packages == filenames, (
              f'database mismatch: missing entries={packages - filenames}, '
              f'missing packages={filenames - packages}'
          )
          EOF

      - uses: actions/configure-pages@v5

      - name: Stage repository under x86_64
        run: |
          mkdir -p public
          mv x86_64 public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
