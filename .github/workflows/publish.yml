name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Sanity check: the database must match the packages actually present.
      - name: Verify database matches packages
        run: |
          cd x86_64
          # repo-add is available via pacman on Arch images; on Ubuntu use bsdtar check
          for db in personal.db.tar.gz; do
            bsdtar -tf "$db" >/dev/null
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: x86_64

      - id: deployment
        uses: actions/deploy-pages@v4
